[package]
name = "cli-timer"
version = "0.2.0"
authors = ["ProgDroid"]
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.1", features = ["derive"] }
crossterm = "0.25.0"
rand = "0.8"
# Same formats as rodio's defaults (flac, mp3, vorbis, wav) but through symphonia: the default mp3
# decoder (minimp3 -> slice-deque) aborts debug builds on a file that is not MP3, which would
# kill `check` on a bad -s file.
rodio = { version = "0.16", default-features = false, features = [
    "symphonia-flac",
    "symphonia-mp3",
    "symphonia-vorbis",
    "symphonia-wav",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tui = "0.19.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_docs_in_private_items = "allow"
separated_literal_suffix = "allow"
implicit_return = "allow"
print_stderr = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
single_char_lifetime_names = "allow"
missing_inline_in_public_items = "allow"
self_named_module_files = "allow"
wildcard_enum_match_arm = "allow"
pattern_type_mismatch = "allow"
std_instead_of_core = "allow"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"
