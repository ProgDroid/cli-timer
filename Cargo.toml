[package]
name = "cli-timer"
version = "0.2.2"
authors = ["ProgDroid"]
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
ratatui = "0.30.2"
# Decoding goes through symphonia only. Up to v0.2.1, rodio 0.16's other mp3 decoder (minimp3 ->
# slice-deque) aborted debug builds on a file that was not MP3, killing `check` on a bad -s file;
# rodio 0.23's alternative (`minimp3_fixed`) is opt-in and stays off. The formats are
# the four chosen on 2026-10-27: mp3, flac, ogg vorbis and PCM wav. MKV/WebM (`symphonia-mkv`) and
# ADPCM wav (`symphonia-adpcm`) are deliberately off, as are `symphonia-isomp4` and `symphonia-all`.
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "symphonia-mp3",
    "symphonia-flac",
    "symphonia-ogg",
    "symphonia-vorbis",
    "symphonia-wav",
    "symphonia-pcm",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_docs_in_private_items = "allow"
separated_literal_suffix = "allow"
implicit_return = "allow"
print_stderr = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
single_char_lifetime_names = "allow"
missing_inline_in_public_items = "allow"
self_named_module_files = "allow"
wildcard_enum_match_arm = "allow"
pattern_type_mismatch = "allow"
std_instead_of_core = "allow"

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"
